<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ой... Помилка{% if status_code %} — {{ status_code }}{% endif %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <style>
            :root {
                --paper: #FAF6EE;
                --card: #FFFFFF;
                --ink: #221C15;
                --ink-soft: #746B5C;
                --ink-faint: #A79E8D;
                --line: rgba(34, 28, 21, 0.10);
                --line-strong: rgba(34, 28, 21, 0.18);

                --accent: #DE5B3A;
                --accent-dark: #B8451E;
                --accent-soft: #FBE4DA;

                --gold: #D69A2D;
                --gold-soft: #F7E9C9;

                --radius-lg: 20px;
                --radius-md: 14px;

                --shadow-sm: 0 1px 3px rgba(34, 28, 21, 0.06);
                --shadow-md: 0 14px 34px -14px rgba(34, 28, 21, 0.22);
            }

            body {
                min-height: 100vh;
                background-color: var(--paper);
                background-image: radial-gradient(rgba(34, 28, 21, 0.055) 1px, transparent 1px);
                background-size: 24px 24px;
                background-position: -12px -12px;
                color: var(--ink);
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            ::selection { background: var(--accent); color: #fff; }

            .error-card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-md);
                padding: 3rem 2.5rem;
                max-width: 480px;
                width: 100%;
                text-align: center;
            }

            .status-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 84px;
                padding: 0.4rem 1.1rem;
                border-radius: 999px;
                background: var(--accent-soft);
                color: var(--accent-dark);
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-weight: 700;
                font-size: 1.05rem;
                letter-spacing: 0.02em;
                margin-bottom: 1.4rem;
            }

            .telegram-snippet {
                display: inline-flex;
                align-items: center;
                gap: 0.6rem;
                background: var(--card);
                border: 2px solid var(--line);
                padding: 0.5rem 1.1rem;
                border-radius: 999px;
                text-decoration: none;
                color: var(--ink-soft);
                font-size: 0.85rem;
                font-weight: 600;
                box-shadow: var(--shadow-sm);
                transition: all .18s ease;
            }
            .telegram-snippet:hover {
                color: #229ED9; /* Telegram blue */
                border-color: rgba(34, 158, 217, .5);
                transform: translateY(-1px);
                box-shadow: var(--shadow-md);
            }
            .telegram-snippet i {
                font-size: 1.1rem;
                color: #229ED9;
            }

            .icon-wrap {
                width: 66px; height: 66px; border-radius: 50%;
                background: var(--gold-soft); color: #8A6316;
                display: inline-flex; align-items: center; justify-content: center;
                font-size: 1.7rem; margin-bottom: 1.2rem;
            }

            .error-title {
                font-family: 'Fraunces', Georgia, serif;
                font-weight: 600;
                font-size: clamp(1.7rem, 2.5vw + 1rem, 2.1rem);
                letter-spacing: -0.02em;
                line-height: 1.15;
                color: var(--ink);
                margin-bottom: 0.6rem;
            }

            .error-message {
                color: var(--ink-soft);
                font-size: 0.98rem;
                line-height: 1.6;
                margin-bottom: 2rem;
            }

            .action-row {
                display: flex;
                flex-direction: column;
                gap: 0.7rem;
            }

            .btn-accent {
                display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
                background: var(--accent);
                border: 1px solid var(--accent);
                color: #fff;
                font-weight: 600;
                padding: .75rem 1.2rem;
                border-radius: 999px;
                text-decoration: none;
                transition: all .18s ease;
                box-shadow: 0 8px 20px -6px rgba(222, 91, 58, .5);
            }
            .btn-accent:hover {
                background: var(--accent-dark); border-color: var(--accent-dark);
                color: #fff; transform: translateY(-1px);
            }

            .btn-ghost {
                display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
                background: var(--card);
                border: 1px solid var(--line);
                color: var(--ink);
                font-weight: 600;
                padding: .7rem 1.2rem;
                border-radius: 999px;
                text-decoration: none;
                transition: all .18s ease;
                box-shadow: var(--shadow-sm);
            }
            .btn-ghost:hover {
                border-color: rgba(222, 91, 58, .5); color: var(--accent-dark);
                transform: translateY(-1px); box-shadow: var(--shadow-md);
            }

            .divider-note {
                margin-top: 1.6rem;
                font-size: 0.82rem;
                color: var(--ink-faint);
            }
        </style>
    </head>

    <body class="py-4">
        <div class="error-card">
            <div class="status-badge">{{ status_code if status_code else "?" }}</div>
            
            <h1 class="error-title">Ой... Помилка</h1>       

            <p class="error-message">Щось пішло не так. Спробуйте оновити сторінку або поверніться пізніше.</p>

            <div class="action-row">
                <a href="/" class="btn-accent">
                    <i class="bi bi-house-door-fill"></i> На головну
                </a>
                {% if telegram %}
                <a href="{{ telegram }}" target="_blank" rel="noopener noreferrer" class="d-block telegram-snippet text-center">
                    <i class="bi bi-telegram"></i> Написати в Telegram
                </a>
                {% endif %}
            </div>

            <p class="divider-note">Якщо проблема повторюється, повідомте мене — це допоможе швидше все виправити.</p>
        </div>
    </body>
</html>
