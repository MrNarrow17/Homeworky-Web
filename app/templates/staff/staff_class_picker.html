<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Оберіть клас — Панель модератора</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <style>
            :root {
                --paper: #FAF6EE;
                --card: #FFFFFF;
                --ink: #221C15;
                --ink-soft: #746B5C;
                --ink-faint: #A79E8D;
                --line: rgba(34, 28, 21, 0.10);
                --line-strong: rgba(34, 28, 21, 0.18);

                --accent: #DE5B3A;
                --accent-dark: #B8451E;
                --accent-soft: #FBE4DA;

                --gold: #D69A2D;
                --gold-soft: #F7E9C9;

                --sage: #6E8C63;
                --sage-soft: #E1EAD9;

                --plum: #8B5A8A;
                --plum-soft: #EFDFED;

                --radius-lg: 20px;
                --radius-md: 14px;

                --shadow-sm: 0 1px 3px rgba(34, 28, 21, 0.06);
                --shadow-md: 0 14px 34px -14px rgba(34, 28, 21, 0.22);
            }

            * { -webkit-tap-highlight-color: transparent; }

            body {
                min-height: 100vh;
                background-color: var(--paper);
                background-image: radial-gradient(rgba(34, 28, 21, 0.055) 1px, transparent 1px);
                background-size: 24px 24px;
                background-position: -12px -12px;
                color: var(--ink);
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
            }

            ::selection { background: var(--accent); color: #fff; }

            .container-picker { max-width: 900px; }

            .eyebrow {
                display: inline-flex; align-items: center; gap: 0.45rem;
                font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase;
                color: var(--accent-dark); font-weight: 700;
            }
            .eyebrow::before { content: "✦"; }

            .page-title {
                font-family: 'Fraunces', Georgia, serif;
                font-weight: 600; font-size: clamp(2.1rem, 3vw + 1.2rem, 3.2rem);
                letter-spacing: -0.02em; line-height: 1.05; color: var(--ink);
            }
            .page-subtitle { color: var(--ink-soft); font-size: 1rem; }

            .topbar {
                display: flex; align-items: center; justify-content: space-between;
                gap: 1rem; margin-bottom: 2rem;
            }
            .btn-logout {
                border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
                border-radius: 999px; padding: 0.6rem 1rem;
                font-weight: 600; transition: all 0.18s ease;
                text-decoration: none;
            }
            .btn-logout:hover {
                color: var(--ink); border-color: var(--line-strong); box-shadow: var(--shadow-sm);
            }

            .role-chip {
                display: inline-flex; align-items: center; gap: 0.4rem;
                background: var(--plum-soft); color: #63356A;
                border-radius: 999px; padding: 0.45rem 0.9rem;
                font-weight: 700; font-size: 0.82rem;
            }

            .search-wrap { position: relative; }
            .search-icon {
                position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%);
                color: var(--ink-faint); font-size: 1.05rem; pointer-events: none;
            }
            .search-input {
                width: 100%;
                padding: 1rem 1.25rem 1rem 3.2rem;
                border-radius: 999px;
                border: 1.5px solid var(--line);
                background: var(--card);
                font-size: 1rem;
                color: var(--ink);
                box-shadow: var(--shadow-sm);
                transition: all .18s ease;
            }
            .search-input::placeholder { color: var(--ink-faint); }
            .search-input:focus {
                outline: none; border-color: var(--accent);
                box-shadow: 0 0 0 4px var(--accent-soft);
            }

            .class-card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                padding: 1.35rem 1.5rem;
                display: flex; align-items: center; justify-content: space-between; gap: 1rem;
                text-decoration: none; color: var(--ink);
                box-shadow: var(--shadow-sm);
                transition: all .2s ease;
                height: 100%;
            }
            .class-card:hover {
                color: var(--ink);
                border-color: rgba(222, 91, 58, .45);
                box-shadow: var(--shadow-md);
                transform: translateY(-3px);
            }

            .avatar-badge {
                width: 52px; height: 52px; border-radius: 15px;
                display: flex; align-items: center; justify-content: center;
                font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.3rem;
                background: var(--accent-soft); color: var(--accent-dark);
                flex: 0 0 auto;
            }
            .class-card-col:nth-child(4n+2) .avatar-badge { background: var(--gold-soft); color: #8A6316; }
            .class-card-col:nth-child(4n+3) .avatar-badge { background: var(--sage-soft); color: #41562F; }
            .class-card-col:nth-child(4n+4) .avatar-badge { background: var(--plum-soft); color: #63356A; }

            .class-name { font-weight: 700; color: var(--ink); margin-bottom: .25rem; }
            .id-chip {
                font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
                font-size: .72rem;
                background: var(--paper);
                border: 1px solid var(--line);
                color: var(--ink-soft);
                padding: .25rem .6rem;
                border-radius: 999px;
                display: inline-block;
            }
            .go-icon { color: var(--ink-faint); font-size: 1.15rem; transition: transform .18s ease; }
            .class-card:hover .go-icon { transform: translateX(3px); color: var(--accent-dark); }

            .empty-state {
                background: var(--card);
                border: 1.5px dashed var(--line-strong);
                border-radius: var(--radius-lg);
                padding: 3.5rem 2rem;
                text-align: center;
                width: 100%;
            }
            .empty-state .icon-wrap {
                width: 62px; height: 62px; border-radius: 50%;
                background: var(--accent-soft); color: var(--accent-dark);
                display: inline-flex; align-items: center; justify-content: center;
                font-size: 1.5rem; margin-bottom: 1rem;
            }

            @media (max-width: 767px) {
                .topbar { align-items: flex-start; }
                .btn-logout { padding: 0.5rem 0.8rem; }
            }
        </style>
    </head>

    <body class="py-4 py-md-5">
        <div class="container container-picker">

            <!-- Top Bar -->
            <div class="topbar">
                <a href="/staff/logout/" class="btn-logout">
                    <i class="bi bi-box-arrow-left me-1"></i> Вийти
                </a>
                <span class="role-chip">
                    <i class="bi bi-shield-fill-check"></i> {{ staff_role }}
                </span>
            </div>

            <div class="eyebrow mb-1 d-flex justify-content-center align-items-center">Керування</div>
            <h1 class="page-title mb-4 text-center">Оберіть клас</h1>

            <!-- Search Bar -->
            <div class="mb-4">
                <div class="search-wrap">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Шукай клас за назвою" autocomplete="off" />
                </div>
            </div>

            <!-- Class List -->
            <div class="row g-3" id="classList">
                {% for class_item in classes %}
                <div class="col-12 col-md-6 class-card-col" data-class-name="{{ class_item.name }}">
                    <a href="/staff/classes/{{ class_item.id }}/dashboard/" class="class-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="avatar-badge">{{ class_item.name|first|upper }}</div>
                            <div>
                                <h5 class="class-name mb-1">{{ class_item.name }}</h5>
                                <span class="id-chip">ID #{{ class_item.id }}</span>
                            </div>
                        </div>
                        <i class="bi bi-arrow-right go-icon"></i>
                    </a>
                </div>
                {% else %}
                <div class="empty-state">
                    <div class="icon-wrap"><i class="bi bi-inbox"></i></div>
                    <h5 class="mb-1" style="font-family:'Fraunces',serif;">Тут поки що порожньо</h5>
                    <p class="text-secondary small mb-0" style="color:var(--ink-soft) !important;">Немає жодного класу.</p>
                </div>
                {% endfor %}
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.getElementById("searchInput").addEventListener("input", function (e) {
                const query = e.target.value.toLowerCase().trim();
                document.querySelectorAll(".class-card-col").forEach((card) => {
                    const className = card.getAttribute("data-class-name").toLowerCase();
                    card.style.display = className.includes(query) ? "" : "none";
                });
            });
        </script>
    </body>
</html>
