<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Вхід модератора — Панель управління</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <script src="https://unpkg.com/htmx.org@1.9.10"></script>
        <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>

        <style>
            :root {
                --paper: #FAF6EE;
                --card: #FFFFFF;
                --ink: #221C15;
                --ink-soft: #746B5C;
                --ink-faint: #A79E8D;
                --line: rgba(34, 28, 21, 0.10);
                --line-strong: rgba(34, 28, 21, 0.18);
                --accent: #DE5B3A;
                --accent-dark: #B8451E;
                --accent-soft: #FBE4DA;
                --gold: #D69A2D;
                --gold-soft: #F7E9C9;
                --radius-lg: 20px;
                --radius-md: 14px;
                --shadow-sm: 0 1px 3px rgba(34,28,21,0.06);
                --shadow-md: 0 14px 34px -14px rgba(34,28,21,0.22);
            }

            * { -webkit-tap-highlight-color: transparent; }

            body {
                background-color: var(--paper);
                background-image: radial-gradient(rgba(34,28,21,0.055) 1px, transparent 1px);
                background-size: 24px 24px;
                background-position: -12px -12px;
                color: var(--ink);
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            ::selection { background: var(--accent); color: #fff; }

            .eyebrow {
                display: inline-flex; align-items: center; gap: .45rem;
                font-size: .78rem; letter-spacing: .14em; text-transform: uppercase;
                color: var(--accent-dark); font-weight: 700; margin-bottom: .5rem;
            }
            .eyebrow::before { content: "✦"; }

            .page-title {
                font-family: 'Fraunces', Georgia, serif;
                font-weight: 600;
                font-size: clamp(1.8rem, 2.5vw + 1rem, 2.4rem);
                letter-spacing: -0.02em;
                line-height: 1.1;
                color: var(--ink);
            }
            .page-subtitle { color: var(--ink-soft); font-size: .92rem; }

            .btn-ghost {
                display: inline-flex; align-items: center; gap: .5rem;
                background: var(--card);
                border: 1px solid var(--line);
                color: var(--ink);
                font-weight: 600;
                padding: .55rem 1.1rem;
                border-radius: 999px;
                text-decoration: none;
                transition: all .18s ease;
                box-shadow: var(--shadow-sm);
                font-size: .88rem;
            }
            .btn-ghost:hover {
                border-color: rgba(222,91,58,.5); color: var(--accent-dark);
                transform: translateY(-1px); box-shadow: var(--shadow-md);
            }

            .auth-card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                padding: 2.25rem 2rem;
                box-shadow: var(--shadow-md);
                position: relative;
            }

            .badge-icon-wrap {
                width: 56px; height: 56px; border-radius: 16px;
                background: var(--accent-soft); color: var(--accent-dark);
                display: inline-flex; align-items: center; justify-content: center;
                font-size: 1.5rem; margin-bottom: 1.2rem;
            }

            .field-label {
                font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
                color: var(--ink-soft); font-weight: 700; margin-bottom: .4rem; display: block;
            }
            .field-wrap { position: relative; }
            .field-icon {
                position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
                color: var(--ink-faint); font-size: 1.05rem;
            }
            .field-input {
                width: 100%;
                padding: .8rem 1rem .8rem 2.7rem;
                border-radius: 12px;
                border: 1.5px solid var(--line);
                background: #fff;
                color: var(--ink);
                font-size: .95rem;
                transition: all .18s ease;
            }
            .field-input::placeholder { color: var(--ink-faint); }
            .field-input:focus {
                outline: none; border-color: var(--accent);
                box-shadow: 0 0 0 4px var(--accent-soft);
            }

            .btn-warm {
                display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
                background: var(--accent);
                border: none;
                color: #fff;
                font-weight: 700;
                padding: .8rem 1.4rem;
                border-radius: 999px;
                box-shadow: 0 10px 24px -8px rgba(222,91,58,.55);
                transition: all .18s ease;
                width: 100%;
                font-size: .95rem;
            }
            .btn-warm:hover { background: var(--accent-dark); transform: translateY(-1px); color: #fff; }
            .btn-warm:active { transform: translateY(0); }

            .auth-alert {
                display: flex; align-items: center;
                padding: .7rem .9rem;
                border-radius: 12px;
                font-size: .85rem;
                font-weight: 500;
            }
            .auth-alert--success { background: #EAF4EA; border: 1px solid #BEE0BE; color: #2F6B3A; }
            .auth-alert--error { background: #FCEAE6; border: 1px solid #F0BBAC; color: #9C3A22; }

            .spinner-warm { color: var(--accent) !important; }
            .htmx-indicator { opacity: 0; transition: opacity 150ms ease-in; }
            .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
        </style>
    </head>
    <body class="py-5 px-3">
        <div class="container" style="max-width: 440px;">
            <div class="mb-4 text-start">
                <a href="/classes/" class="btn-ghost">
                    <i class="bi bi-arrow-left"></i> На головну
                </a>
            </div>

            <div class="auth-card">
                <div class="text-center">
                    <div class="badge-icon-wrap">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <div class="eyebrow justify-content-center d-flex">Модерація</div>
                    <h1 class="page-title mb-2">Вхід модератора</h1>
                    <p class="page-subtitle mb-4">Увійдіть для управління класами та домашніми завданнями</p>
                </div>

                <!-- Updated hx-post to /staff/login/ -->
                <form id="loginForm" hx-post="/staff/login/" hx-ext="json-enc" hx-swap="none">
                    <div class="mb-3">
                        <label for="usernameInput" class="field-label">Логін</label>
                        <div class="field-wrap">
                            <i class="bi bi-person field-icon"></i>
                            <input 
                                type="text" 
                                class="field-input" 
                                id="usernameInput" 
                                name="username" 
                                placeholder="Ваш логін" 
                                required 
                                autocomplete="username"
                            />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="passwordInput" class="field-label">Пароль</label>
                        <div class="field-wrap">
                            <i class="bi bi-key field-icon"></i>
                            <input 
                                type="password" 
                                class="field-input" 
                                id="passwordInput" 
                                name="password" 
                                placeholder="••••••••••••" 
                                required 
                                autocomplete="current-password"
                            />
                        </div>
                    </div>

                    <div id="loginResponse" class="my-3"></div>

                    <div class="mt-4">
                        <button type="submit" class="btn-warm">
                            <span>Увійти в панель</span>
                            <i class="bi bi-box-arrow-in-right"></i>
                            <span id="loginSpinner" class="spinner-border spinner-border-sm spinner-warm htmx-indicator ms-1" role="status"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.addEventListener("htmx:afterRequest", function (evt) {
                if (evt.detail.elt.getAttribute('id') !== 'loginForm') {
                    return;
                }

                const xhr = evt.detail.xhr;
                const responseBox = document.getElementById("loginResponse");

                if (evt.detail.successful) {
                    responseBox.innerHTML = `
                        <div class="auth-alert auth-alert--success">
                            <i class="bi bi-check-circle-fill me-2"></i> Успішно! Перенаправлення...
                        </div>`;

                    let redirectUrl = "/staff/dashboard/";
                    try {
                        const responseData = typeof xhr.response === "string" ? JSON.parse(xhr.response) : xhr.response;
                        if (responseData && responseData.redirect_url) {
                            redirectUrl = responseData.redirect_url;
                        }
                    } catch (e) {
                        console.error("Не вдалося розпарсити JSON відповіді:", e);
                    }

                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);

                } else {
                    let errorMsg = "Невірний логін або пароль.";

                    try {
                        const errorData = typeof xhr.response === "string" ? JSON.parse(xhr.response) : xhr.response;
                        if (typeof errorData.detail === "string") {
                            errorMsg = errorData.detail;
                        } else if (Array.isArray(errorData.detail) && errorData.detail.length > 0) {
                            errorMsg = `Помилка: ${errorData.detail[0].msg}`;
                        }
                    } catch (e) {
                        if (xhr.status === 401) {
                            errorMsg = "Невірний логін або пароль.";
                        } else if (xhr.status === 422) {
                            errorMsg = "Перевірте правильність заповнення полів.";
                        } else if (xhr.status >= 500) {
                            errorMsg = "Помилка сервера. Спробуйте пізніше.";
                        }
                    }

                    responseBox.innerHTML = `
                        <div class="auth-alert auth-alert--error">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> ${errorMsg}
                        </div>`;
                }
            });
        </script>
    </body>
</html>
