<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% if homework %}Редагувати завдання{% else %}Нове завдання{% endif %}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <style>
            :root {
                --paper: #FAF6EE; --card: #FFFFFF; --ink: #221C15; --ink-soft: #746B5C;
                --ink-faint: #A79E8D; --line: rgba(34, 28, 21, 0.10); --line-strong: rgba(34, 28, 21, 0.18);
                --accent: #DE5B3A; --accent-dark: #B8451E; --accent-soft: #FBE4DA;
                --radius-lg: 20px; --radius-md: 14px;
                --shadow-sm: 0 1px 3px rgba(34,28,21,0.06); --shadow-md: 0 14px 34px -14px rgba(34,28,21,0.22);
            }
            * { -webkit-tap-highlight-color: transparent; }
            body { min-height: 100vh; background-color: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; }
            ::selection { background: var(--accent); color: #fff; }

            .container-dashboard { max-width: 800px; }
            .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
            
            .btn-ghost { display: inline-flex; align-items: center; gap: .5rem; background: var(--card); border: 1px solid var(--line); color: var(--ink); font-weight: 600; padding: .6rem 1.1rem; border-radius: 999px; text-decoration: none; transition: all .18s ease; box-shadow: var(--shadow-sm); font-size: .9rem; }
            .btn-ghost:hover { border-color: rgba(222,91,58,.5); color: var(--accent-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }

            .eyebrow { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-dark); font-weight: 700; margin-bottom: .5rem; }
            .eyebrow::before { content: "✦"; }
            .page-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(1.9rem, 3vw + 1rem, 2.5rem); letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); margin: 0; }

            .surface-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 2rem; box-shadow: var(--shadow-sm); }
            
            .field-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 700; margin-bottom: .4rem; display: block; }
            .field-input { width: 100%; padding: .8rem 1rem; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font-size: .95rem; transition: all .18s ease; }
            .field-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
            textarea.field-input { min-height: 120px; resize: vertical; }

            .btn-warm { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; background: var(--accent); border: none; color: #fff; font-weight: 700; padding: .8rem 1.4rem; border-radius: 999px; box-shadow: 0 10px 24px -8px rgba(222,91,58,.55); transition: all .18s ease; width: 100%; font-size: .95rem; }
            .btn-warm:hover { background: var(--accent-dark); transform: translateY(-1px); color: #fff; }

            .file-dropzone {
                border: 2px dashed var(--line-strong); border-radius: var(--radius-md);
                padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: all .2s ease; background: var(--paper);
            }
            .file-dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
            .file-dropzone i { font-size: 2rem; color: var(--accent-dark); margin-bottom: .5rem; display: block; }
            .file-dropzone p { color: var(--ink-soft); margin: 0; font-size: .9rem; font-weight: 500; }
            .file-dropzone span { color: var(--ink-faint); font-size: .8rem; }
            
            .image-preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; }
            .image-preview-wrapper {
                position: relative; width: 100px; height: 100px; border-radius: 8px; overflow: visible; border: 1px solid var(--line);
            }
            .image-preview-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
            
            .remove-img-btn {
                position: absolute; top: -6px; right: -6px; width: 24px; height: 24px;
                background: var(--ink); color: #fff; border: 2px solid var(--card);
                border-radius: 50%; display: flex; align-items: center; justify-content: center;
                cursor: pointer; font-size: 0.7rem; z-index: 5; transition: transform .15s ease;
            }
            .remove-img-btn:hover { transform: scale(1.15); background: var(--accent-dark); }
        </style>
    </head>
    <body class="py-4 py-md-5">
        <div class="container container-dashboard">
            
            <div class="topbar">
                <a href="/staff/dashboard/" class="btn-ghost">
                    <i class="bi bi-arrow-left"></i> Скасувати
                </a>
            </div>

            <header class="mb-4">
                <div class="eyebrow">Керування</div>
                <h1 class="page-title">
                    {% if homework %} Редагувати завдання {% else %} Нове завдання {% endif %}
                </h1>
            </header>

            <div class="surface-card">
                <form method="POST" action="{% if homework %}/staff/homework/{{ homework.id }}/edit/{% else %}/staff/classes/{{ class_id }}/homework/new/{% endif %}" enctype="multipart/form-data" id="hwForm">
                    
                    <div class="mb-3">
                        <label class="field-label">Предмет</label>
                        <input type="text" name="subject" class="field-input" value="{{ homework.subject if homework else '' }}" placeholder="Напр. Математика" required>
                    </div>

                    <div class="mb-3">
                        <label class="field-label">Заголовок</label>
                        <input type="text" name="title" class="field-input" value="{{ homework.title if homework else '' }}" placeholder="Тема завдання" required>
                    </div>

                    <div class="mb-3">
                        <label class="field-label">Опис</label>
                        <textarea name="description" class="field-input" placeholder="Деталі домашнього завдання..." required>{{ homework.description if homework else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="field-label">Дата</label>
                        <input type="date" name="date" class="field-input" value="{{ homework.date.strftime('%Y-%m-%d') if homework else '' }}" max="9999-12-31" required>

                    </div>

                    <!-- Unified Image Preview Area -->
                    <div class="mb-3">
                        <label class="field-label">Зображення</label>
                        
                        <!-- Existing images use name="images" and type="hidden" -->
                        <div id="unifiedImageContainer" class="image-preview-container mb-2">
                            {% if homework %}
                                {% for img in homework.images %}
                                    <div class="image-preview-wrapper">
                                        <img src="{{ img }}" alt="Existing image">
                                        <input type="hidden" name="images" value="{{ img }}">
                                        <div class="remove-img-btn" onclick="this.parentElement.remove()"><i class="bi bi-x-lg"></i></div>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        </div>

                        <!-- Dropzone for adding new files. Also uses name="images" -->
                        <label for="imageInput" class="file-dropzone d-block">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <p>Натисніть, щоб обрати файли</p>
                            <span>або перетягніть їх сюди (JPG, PNG)</span>
                        </label>
                        <input type="file" name="images" id="imageInput" class="d-none" multiple accept="image/*">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn-warm">
                            {% if homework %} Зберегти зміни {% else %} Опублікувати завдання {% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const imageInput = document.getElementById('imageInput');
            const dropzone = document.querySelector('.file-dropzone');
            const unifiedContainer = document.getElementById('unifiedImageContainer');

            // Array to hold newly selected files (DataTransfer allows us to update input.files)
            let filesArray = [];

            // Update input.files when filesArray changes
            function updateInputFiles() {
                const dt = new DataTransfer();
                filesArray.forEach(file => dt.items.add(file));
                imageInput.files = dt.files;
            }

            // Handle new file selection
            function handleFiles(files) {
                Array.from(files).forEach(file => {
                    filesArray.push(file);
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'image-preview-wrapper';
                        
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        
                        const cross = document.createElement('div');
                        cross.className = 'remove-img-btn';
                        cross.innerHTML = '<i class="bi bi-x-lg"></i>';
                        cross.onclick = () => {
                            // Remove from filesArray
                            filesArray = filesArray.filter(f => f.name !== file.name || f.lastModified !== file.lastModified);
                            updateInputFiles(); // Update the actual input
                            wrapper.remove(); // Remove the visual element
                        };

                        wrapper.appendChild(img);
                        wrapper.appendChild(cross);
                        unifiedContainer.appendChild(wrapper); // Append to the same container!
                    };
                    reader.readAsDataURL(file);
                });
                updateInputFiles();
            }

            // Dropzone click to open file dialog
            dropzone.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') imageInput.click();
            });

            // Drag and drop handlers
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); });
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, () => {
                    dropzone.style.borderColor = 'var(--accent)';
                    dropzone.style.background = 'var(--accent-soft)';
                });
            });
            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, () => {
                    dropzone.style.borderColor = 'var(--line-strong)';
                    dropzone.style.background = 'var(--paper)';
                });
            });

            dropzone.addEventListener('drop', (e) => {
                handleFiles(e.dataTransfer.files);
            });

            imageInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
        </script>
    </body>
</html>
