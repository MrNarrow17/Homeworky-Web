name: Deploy to FastAPI Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run database migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          HSTS_VALUE: ${{ secrets.HSTS_VALUE }}
          CLASS_SESSION_COOKIE: ${{ vars.CLASS_SESSION_COOKIE }}
          STAFF_SESSION_COOKIE: ${{ vars.STAFF_SESSION_COOKIE }}
          TELEGRAM_LINK: ${{ vars.TELEGRAM_LINK }}

      - name: Deploy to FastAPI Cloud
        run: uv run fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ vars.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ vars.FASTAPI_CLOUD_APP_ID }}

          
